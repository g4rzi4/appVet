<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare - Hospital Veterinario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== PANTALLA DE AUTENTICACIÓN ===== -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">🐾</span>
            <h1>VetCare</h1>
            <p>Hospital Veterinario</p>
        </div>

        <!-- Login -->
        <div id="login-panel">
            <h2>Iniciar Sesión</h2>
            <form onsubmit="Auth.login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Ingresar</button>
            </form>
            <p class="auth-switch">¿No tienes cuenta? <a href="#" onclick="showPanel('register-panel');return false">Regístrate como dueño</a></p>
            <div class="auth-hint">Admin: admin@vetcare.com / admin123</div>
        </div>

        <!-- Registro -->
        <div id="register-panel" style="display:none">
            <h2>Registro de Dueño</h2>
            <form onsubmit="Auth.register(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="reg-nombre" placeholder="Juan" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="reg-apellido" placeholder="Pérez" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="reg-telefono" placeholder="555-1234">
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="reg-direccion" placeholder="Calle 123, Ciudad">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-full">Crear Cuenta</button>
            </form>
            <p class="auth-switch">¿Ya tienes cuenta? <a href="#" onclick="showPanel('login-panel');return false">Inicia sesión</a></p>
        </div>
    </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" style="display:none">
    <aside id="sidebar">
        <div class="sidebar-logo">
            <span>🐾</span>
            <span>VetCare</span>
        </div>
        <nav id="sidebar-nav"></nav>
        <div class="sidebar-user">
            <div class="user-avatar" id="user-avatar"></div>
            <div class="user-details">
                <div id="user-name"></div>
                <div id="user-role-label"></div>
            </div>
            <button onclick="Auth.logout()" class="logout-btn" title="Cerrar sesión">⏻</button>
        </div>
    </aside>

    <main id="main-area">
        <header id="top-bar">
            <button id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
            <h2 id="page-title">Dashboard</h2>
        </header>
        <div id="view-container"></div>
    </main>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay" onclick="Modal.closeOnOverlay(event)">
    <div id="modal-box">
        <div id="modal-header">
            <h3 id="modal-title"></h3>
            <button onclick="Modal.close()" class="modal-close">✕</button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<!-- ===== TOASTS ===== -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
