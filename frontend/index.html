<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare - Hospital Veterinario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== LOADING OVERLAY ===== -->
<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<!-- ===== AUTH SCREEN ===== -->
<div id="auth-screen" style="display:none">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4" cy="8" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            </span>
            <h1>VetCare</h1>
            <p>Hospital Veterinario</p>
        </div>

        <div id="login-panel">
            <h2>Iniciar Sesión</h2>
            <form onsubmit="Auth.login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Ingresar</button>
            </form>
            <p class="auth-switch">¿No tienes cuenta? <a href="#" onclick="showPanel('register-panel');return false">Regístrate como dueño</a></p>
        </div>

        <div id="register-panel" style="display:none">
            <h2>Registro de Dueño</h2>
            <form onsubmit="Auth.register(event)">
                <div class="form-row">
                    <div class="form-group"><label>Nombre</label><input type="text" id="reg-nombre" required></div>
                    <div class="form-group"><label>Apellido</label><input type="text" id="reg-apellido" required></div>
                </div>
                <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
                <div class="form-group"><label>Teléfono</label><input type="tel" id="reg-telefono"></div>
                <div class="form-group"><label>Dirección</label><input type="text" id="reg-direccion"></div>
                <div class="form-group"><label>Contraseña</label><input type="password" id="reg-password" required minlength="8" placeholder="Mínimo 8 caracteres, una mayúscula"></div>
                <button type="submit" class="btn btn-primary w-full">Crear Cuenta</button>
            </form>
            <p class="auth-switch">¿Ya tienes cuenta? <a href="#" onclick="showPanel('login-panel');return false">Inicia sesión</a></p>
        </div>

        <div id="change-password-panel" style="display:none">
            <h2>Crear Nueva Contraseña</h2>
            <p style="color:var(--text-secondary);font-size:.875rem;margin-bottom:1rem">Es tu primer acceso. Elige una contraseña personal para continuar.</p>
            <form onsubmit="Auth.changePassword(event)">
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="new-password" required minlength="8" placeholder="Mínimo 8 caracteres, una mayúscula">
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" required minlength="8" placeholder="Repite tu nueva contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-full">Guardar Contraseña</button>
            </form>
        </div>
    </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" style="display:none">
    <aside id="sidebar">
        <div class="sidebar-logo"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4" cy="8" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><span>VetCare</span></div>
        <nav id="sidebar-nav"></nav>
        <div class="sidebar-user">
            <div class="user-avatar" id="user-avatar"></div>
            <div class="user-details">
                <div id="user-name"></div>
                <div id="user-role-label"></div>
            </div>
            <button onclick="Auth.logout()" class="logout-btn" title="Cerrar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button>
        </div>
    </aside>
    <main id="main-area">
        <header id="top-bar">
            <button id="sidebar-toggle" onclick="toggleSidebar()"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
            <h2 id="page-title">Dashboard</h2>
        </header>
        <div id="view-container"></div>
    </main>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay" onclick="Modal.closeOnOverlay(event)">
    <div id="modal-box">
        <div id="modal-header">
            <h3 id="modal-title"></h3>
            <button onclick="Modal.close()" class="modal-close"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<!-- ===== TOASTS ===== -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
